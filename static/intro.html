<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevAgenda</title>
  <link rel="icon" type="image/svg+xml" href="/static/img/favicon.svg">
  <noscript><meta http-equiv="refresh" content="1;url=/"></noscript>
  <script>
    // Sem login não há intro: volta para a tela de entrada.
    try {
      if (!localStorage.getItem('devagenda_token')) { location.replace('/login'); }
      if (localStorage.getItem('devagenda_theme') === 'dark') document.documentElement.classList.add('dark');
    } catch (_) {}
  </script>
  <style>
    /* CSS próprio da intro: não depende do style.css (nem do cache dele). */
    html, body { margin: 0; height: 100%; overflow: hidden; }
    body {
      display: flex; align-items: center; justify-content: center;
      background: #f1f5f9; cursor: pointer;
      transition: opacity 0.4s ease;
    }
    html.dark body { background: #0f172a; }
    body.is-leaving { opacity: 0; }

    svg { width: 260px; max-width: 56vw; height: auto; overflow: visible;
          filter: drop-shadow(0 8px 16px rgba(30, 58, 138, 0.18)); }
    html.dark svg { filter: none; }

    /* 1) a agenda aparece */
    .intro-agenda {
      opacity: 0; transform-box: fill-box; transform-origin: center;
      animation: intro-agenda 0.55s cubic-bezier(0.2, 0.8, 0.2, 1) 0.1s forwards;
    }
    @keyframes intro-agenda {
      from { opacity: 0; transform: translateY(10px) scale(0.96); }
      to   { opacity: 1; transform: none; }
    }

    /* 2) o marcador azul sai de trás; 3) depois o amarelo */
    .intro-marker {
      opacity: 0; transform: translateX(-90px);
      animation: intro-marker 0.6s cubic-bezier(0.3, 0.7, 0.4, 1) forwards;
    }
    .intro-marker--blue   { animation-delay: 0.7s; }
    .intro-marker--yellow { animation-delay: 1.05s; }
    @keyframes intro-marker {
      0%   { opacity: 1; transform: translateX(-90px); }
      70%  { opacity: 1; transform: translateX(14px); }
      100% { opacity: 1; transform: translateX(0); }
    }

    /* 4) o cursor do terminal pisca uma vez */
    .intro-cursor { animation: intro-blink 0.5s ease-in-out 1.7s 1; }
    @keyframes intro-blink { 0%, 100% { opacity: 1; } 45%, 55% { opacity: 0; } }

    /* Sem regra de "reduzir movimento" de propósito: é uma intro curta e a animação é o ponto dela.
       Para quem não quer ver, clique ou tecla pula. */
  </style>
</head>

  <script>
    // Duração: ~2,5 s de animação e depois some. Clique ou tecla pula.
    (function () {
      var done = false;
      function go() {
        if (done) return; done = true;
        document.body.classList.add('is-leaving');
        setTimeout(function () { location.replace('/'); }, 400);
      }
      document.body.addEventListener('click', go);
      window.addEventListener('keydown', go);
      setTimeout(go, 2800);
    })();
  </script>
