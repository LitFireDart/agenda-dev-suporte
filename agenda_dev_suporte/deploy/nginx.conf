# Configuração Nginx para DevAgenda (Proxy Reverso com SSL/HTTPS)
# Salve este arquivo em: /etc/nginx/sites-available/devagenda
# E crie o link simbólico: sudo ln -s /etc/nginx/sites-available/devagenda /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name agenda.seudominio.com; # Substitua pelo seu domínio ou IP do servidor

    # Redirecionamento HTTP -> HTTPS (descomente após gerar o certificado com certbot)
    # return 301 https://$host$request_uri;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Suporte a WebSockets / Server-Sent Events se necessário
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts para conexões mais longas
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

# Configuração HTTPS gerada automaticamente pelo Certbot:
# sudo apt install -y certbot python3-certbot-nginx
# sudo certbot --nginx -d agenda.seudominio.com
