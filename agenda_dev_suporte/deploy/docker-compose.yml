version: '3.8'

services:
  devagenda:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: devagenda_app
    restart: always
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=sua-chave-super-secreta-alterar-em-producao-2026
      - DATABASE_URL=sqlite:////app/data/agenda.db
      - TOKEN_EXPIRE_HOURS=72
      - INITIAL_ADMIN_USER=admin
      - INITIAL_ADMIN_PASSWORD=admin123
    volumes:
      - devagenda_data:/app/data

volumes:
  devagenda_data:
    driver: local
